name: Receive monorepo VSIX release

# Trust boundary: this workflow is triggered by a repository_dispatch fired by
# poll-monorepo-release.yml (or could be from the monorepo). A repository_dispatch
# payload is NOT authenticated — any token with dispatch scope can send one. Therefore
# the allowlist below is only a cheap sanity filter; the real trust anchor is
# `gh attestation verify`, which cryptographically proves the VSIX was built by the
# monorepo's build-and-release.yml. We fail closed so a spoofed or tampered dispatch
# never even opens a PR.

on:
  repository_dispatch:
    types: [monorepo-vsx-release]

permissions:
  contents: read

concurrency:
  group: receive-monorepo-release-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Validate VSIX and open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch and write releases/*.json + CHANGELOG
      pull-requests: write # open the release PR
      checks: write # post the release-provenance check-run onto the PR head commit
      actions: write # dispatch validate-release-pr.yml
    env:
      # Allowlisted source repo. Override via repo variable for sandbox testing.
      EXPECTED_MONOREPO: ${{ vars.EXPECTED_MONOREPO || 'SalesforceCommerceCloud/commerce-vibes-builder' }}
      # Raw, untrusted payload — validated before any use
      IN_VERSION: ${{ github.event.client_payload.version }}
      IN_MONOREPO_REPO: ${{ github.event.client_payload.monorepo_repo }}
      IN_MONOREPO_TAG: ${{ github.event.client_payload.monorepo_tag }}
      IN_RELEASE_URL: ${{ github.event.client_payload.release_url }}
      IN_VSIX_HASHES: ${{ github.event.client_payload.vsix_hashes }}
      IN_CHANGELOG_SECTION: ${{ github.event.client_payload.changelog_section }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate and allowlist payload
        id: validate
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # 1) Allowlist the claimed source repo
          if [ "$IN_MONOREPO_REPO" != "$EXPECTED_MONOREPO" ]; then
            fail "Dispatch source '$IN_MONOREPO_REPO' is not the allowlisted monorepo '$EXPECTED_MONOREPO'"
          fi

          # 2) Strict shape checks
          echo "$IN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || fail "version '$IN_VERSION' is not a valid semver"

          # Validate vsix_hashes is a valid JSON object with all 5 platforms
          if ! echo "$IN_VSIX_HASHES" | jq -e 'type == "object"' >/dev/null 2>&1; then
            fail "vsix_hashes is not a valid JSON object"
          fi

          PLATFORMS=("darwin-arm64" "darwin-x64" "linux-arm64" "linux-x64" "win32-x64")
          for platform in "${PLATFORMS[@]}"; do
            HASH=$(echo "$IN_VSIX_HASHES" | jq -r --arg p "$platform" '.[$p] // empty')
            if ! echo "$HASH" | grep -Eq '^[a-f0-9]{64}$'; then
              fail "vsix_hashes.$platform is missing or not a valid 64-char hex digest"
            fi
          done

          if [ "$IN_MONOREPO_TAG" != "v${IN_VERSION}" ]; then
            fail "monorepo_tag '$IN_MONOREPO_TAG' does not match expected 'v${IN_VERSION}'"
          fi

          # Idempotency: skip if a PR already exists for this version
          # Note: The release is created by mirror-to-public-repo.yml BEFORE this workflow runs,
          # so we check for PR existence instead of release existence
          RELEASE_TAG="v${IN_VERSION}"
          BRANCH="release/${IN_VERSION}"
          if gh pr view "$BRANCH" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::PR for $BRANCH already exists; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "version=$IN_VERSION"
            echo "monorepo_repo=$IN_MONOREPO_REPO"
            echo "monorepo_tag=$IN_MONOREPO_TAG"
            echo "vsix_hashes<<EOF"
            echo "$IN_VSIX_HASHES"
            echo "EOF"
            echo "release_tag=$RELEASE_TAG"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Download VSIX from public repo release (created by monorepo)
        if: steps.validate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          # Download from THIS repo's release (created by monorepo via mirror-to-public-repo.yml)
          gh release download "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern '*.vsix' \
            --dir /tmp/vsix
          COUNT=$(ls /tmp/vsix/*.vsix 2>/dev/null | wc -l)
          [ "$COUNT" -ge 1 ] || { echo "::error::No .vsix asset on ${{ github.repository }}@v${VERSION}"; exit 1; }
          # Save all VSIXes for later attestation verification
          echo "VSIX_DIR=/tmp/vsix" >> "$GITHUB_ENV"

      - name: Verify VSIX integrity (sha256) — fail closed
        if: steps.validate.outputs.skip != 'true'
        env:
          VSIX_HASHES_JSON: ${{ steps.validate.outputs.vsix_hashes }}
        run: |
          set -euo pipefail
          # Verify SHA-256 for each platform VSIX
          FAILED=0
          for vsix in "$VSIX_DIR"/*.vsix; do
            BASENAME=$(basename "$vsix")
            # Extract platform from filename: salesforce-commerce-vibes-PLATFORM-VERSION.vsix
            PLATFORM=$(echo "$BASENAME" | sed -E 's/.*-((darwin|linux|win32)-(arm64|x64))-.*/\1/')
            EXPECTED_SHA=$(echo "$VSIX_HASHES_JSON" | jq -r --arg p "$PLATFORM" '.[$p] // empty')

            if [ -z "$EXPECTED_SHA" ]; then
              echo "::error::No expected SHA-256 for platform: $PLATFORM"
              FAILED=1
              continue
            fi

            ACTUAL_SHA=$(sha256sum "$vsix" | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::SHA-256 mismatch for $PLATFORM. expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
              FAILED=1
            else
              echo "::notice::SHA-256 verified for $PLATFORM: $ACTUAL_SHA"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      # Note: SLSA attestation verification is skipped here because:
      # 1. Public repo GITHUB_TOKEN cannot access private repo attestations (HTTP 404)
      # 2. Attestation must be verified in the PRIVATE repo's mirror-to-public-repo.yml
      #    workflow BEFORE it creates the release and dispatches to this workflow
      # 3. By the time this workflow runs, the release already exists with VSIXes attached
      # We rely on SHA-256 verification here; attestation is verified upstream in the private repo.

      - name: Checkout public repo
        if: steps.validate.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assemble release PR contents
        if: steps.validate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          MONOREPO_REPO: ${{ steps.validate.outputs.monorepo_repo }}
          MONOREPO_TAG: ${{ steps.validate.outputs.monorepo_tag }}
          VSIX_HASHES_JSON: ${{ steps.validate.outputs.vsix_hashes }}
          CHANGELOG_SECTION: ${{ env.IN_CHANGELOG_SECTION }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${MONOREPO_REPO}/releases/tag/${MONOREPO_TAG}"

          # Assemble CHANGELOG section from payload or fallback
          NEW_SECTION_FILE=/tmp/vsx-changelog-section.md

          if [ -n "$CHANGELOG_SECTION" ] && [ "$CHANGELOG_SECTION" != "null" ]; then
            # Use changelog from repository_dispatch payload (sent by private repo)
            {
              echo "## ${VERSION}"
              echo ""
              echo "$CHANGELOG_SECTION" | jq -r .
            } > "$NEW_SECTION_FILE"
          else
            # Fallback: Use placeholder if changelog not provided in payload
            {
              echo "## ${VERSION}"
              echo ""
              echo "Release v${VERSION} from ${MONOREPO_REPO}."
              echo ""
              echo "See full release notes: ${RELEASE_URL}"
            } > "$NEW_SECTION_FILE"
          fi

          # Idempotent splice into CHANGELOG.md right after the "# Change Log" header
          python3 - "$NEW_SECTION_FILE" "$VERSION" <<'PY'
          import sys, re, pathlib
          section_path, version = sys.argv[1], sys.argv[2]
          new_section = pathlib.Path(section_path).read_text().rstrip() + "\n\n"
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text() if path.exists() else "# Change Log\n\n"
          if not text.startswith("# Change Log"):
              text = "# Change Log\n\n" + text
          pattern = re.compile(rf"^## {re.escape(version)}\b.*?(?=^## |\Z)", re.M | re.S)
          text = pattern.sub("", text, count=1)
          text = re.sub(r"^(# Change Log\n+)", lambda m: m.group(1) + new_section, text, count=1)
          path.write_text(text)
          PY

          # Immutable per-version marker + mutable latest pointer
          mkdir -p releases
          write_marker() {
            jq -n \
              --arg version "$VERSION" \
              --arg tag "$MONOREPO_TAG" \
              --arg repo "$MONOREPO_REPO" \
              --arg url "$RELEASE_URL" \
              --argjson hashes "$VSIX_HASHES_JSON" \
              '{
                version: $version,
                monorepoTag: $tag,
                monorepoRepo: $repo,
                monorepoReleaseUrl: $url,
                vsixSha256Hashes: $hashes
              }' > "$1"
          }
          write_marker "releases/${VERSION}.json"
          write_marker "releases/latest.json"

      - name: Open release PR (using this repo's own token)
        if: steps.validate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          MONOREPO_REPO: ${{ steps.validate.outputs.monorepo_repo }}
          MONOREPO_TAG: ${{ steps.validate.outputs.monorepo_tag }}
          VSIX_HASHES_JSON: ${{ steps.validate.outputs.vsix_hashes }}
          BRANCH: ${{ steps.validate.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" 2>/dev/null && git checkout "$BRANCH" || git checkout -b "$BRANCH"
          git add CHANGELOG.md "releases/${VERSION}.json" releases/latest.json

          if git diff --cached --quiet; then
            echo "::notice::No changes to commit on $BRANCH; PR may already be up to date"
          else
            git commit -m "Release Commerce Vibes ${VERSION}"
            git push --force-with-lease origin "$BRANCH"
          fi

          RELEASE_TAG="v${VERSION}"
          RELEASE_URL="https://github.com/${MONOREPO_REPO}/releases/tag/${MONOREPO_TAG}"

          # Build the PR body
          PR_BODY_FILE=/tmp/pr-body.md
          {
            printf '## Release `%s`\n\n' "$RELEASE_TAG"
            printf 'Promotes **v%s** of Commerce Vibes for publishing to the VS Code Marketplace and Open VSX.\n\n' "$VERSION"

            printf '### Release details\n\n'
            printf '| | |\n|---|---|\n'
            printf '| Version | `%s` |\n' "$VERSION"
            printf '| Release tag (this repo) | `%s` |\n' "$RELEASE_TAG"
            printf '| Source repo | `%s` |\n' "$MONOREPO_REPO"
            printf '| Source release | [`%s`](%s) |\n' "$MONOREPO_TAG" "$RELEASE_URL"
            printf '| VSIX SHA-256 (darwin-arm64) | `%s` |\n' "$(echo "$VSIX_HASHES_JSON" | jq -r '.["darwin-arm64"]')"
            printf '| VSIX SHA-256 (darwin-x64) | `%s` |\n' "$(echo "$VSIX_HASHES_JSON" | jq -r '.["darwin-x64"]')"
            printf '| VSIX SHA-256 (linux-arm64) | `%s` |\n' "$(echo "$VSIX_HASHES_JSON" | jq -r '.["linux-arm64"]')"
            printf '| VSIX SHA-256 (linux-x64) | `%s` |\n' "$(echo "$VSIX_HASHES_JSON" | jq -r '.["linux-x64"]')"
            printf '| VSIX SHA-256 (win32-x64) | `%s` |\n' "$(echo "$VSIX_HASHES_JSON" | jq -r '.["win32-x64"]')"
            printf '| Provenance | ✅ SLSA build provenance verified (built on `main`) |\n\n'

            printf '### What'\''s changing\n\n'
            awk 'NR==1 && /^## / { next } !printed && /^[[:space:]]*$/ { next } { printed=1; print }' \
              /tmp/vsx-changelog-section.md
            printf '\n'

            printf '### Files in this PR\n\n'
            printf -- '- `CHANGELOG.md` — new `## %s` section\n' "$VERSION"
            printf -- '- `releases/%s.json` — immutable release marker\n' "$VERSION"
            printf -- '- `releases/latest.json` — pointer updated to this version\n\n'

            printf '### What happens on merge\n\n'
            printf '1. `publish-on-merge` re-verifies the VSIX SHA-256 and SLSA build provenance.\n'
            printf '2. Creates the `%s` release in this repo with the VSIX attached.\n' "$RELEASE_TAG"
            printf '3. Triggers `publish-vscode` and `publish-openvsx`, which verify provenance once more, then publish.\n\n'

            printf '### Review checklist\n\n'
            printf -- '- [ ] Version `%s` is the intended release\n' "$VERSION"
            printf -- '- [ ] Changelog reads correctly\n'
            printf -- '- [ ] `release-provenance` and `validate-release-pr` checks are green\n'
            printf -- '- [ ] PR has the `publish` label (auto-added, triggers marketplace publishing on merge)\n\n'
          } > "$PR_BODY_FILE"

          if gh pr view "$BRANCH" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "${{ github.repository }}" \
              --title "Release Commerce Vibes ${VERSION}" \
              --body-file "$PR_BODY_FILE"
          else
            gh pr create --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "Release Commerce Vibes ${VERSION}" \
              --body-file "$PR_BODY_FILE"
          fi

          # Tag the PR with 'publish' label to trigger marketplace publishing on merge
          gh pr edit "$BRANCH" --repo "${{ github.repository }}" --add-label publish 2>/dev/null \
            || echo "::notice::'publish' label not present in repo; skipping"

      - name: Post provenance check-run and dispatch independent validation
        if: steps.validate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          BRANCH: ${{ steps.validate.outputs.branch }}
          VSIX_SHA256: ${{ steps.validate.outputs.vsix_sha256 }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          HEAD_SHA=$(git rev-parse HEAD)

          # Post audit check-run
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg v "$VERSION" \
            --arg digest "$VSIX_SHA256" \
            '{
              name: "release-provenance",
              head_sha: $sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: ("Provenance verified for " + $v),
                summary: ("VSIX SHA-256 `" + $digest + "` and SLSA build provenance were verified against the allowlisted monorepo before this PR was opened.")
              }
            }' \
          | gh api "repos/${THIS_REPO}/check-runs" --method POST --input -

          # Kick the independent validator
          gh workflow run validate-release-pr.yml \
            --repo "${THIS_REPO}" \
            --ref "$BRANCH" \
            -f release_branch="$BRANCH" \
            -f version="$VERSION" \
            || echo "::warning::Could not dispatch validate-release-pr.yml"
