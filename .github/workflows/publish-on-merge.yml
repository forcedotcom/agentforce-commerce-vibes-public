name: Publish on merge

# Verifies and approves a release PR. This is the third verification gate — re-verifies
# VSIX SHA256 and SLSA attestation after human review. On merge, triggers marketplace
# publishing workflows (publish-vscode.yml and publish-openvsx.yml) via workflow_dispatch.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Trigger marketplace publishing from merged PR
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read # read release and repository contents
      actions: write # trigger publish-vscode.yml workflow
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_MONOREPO: ${{ vars.EXPECTED_MONOREPO || 'SalesforceCommerceCloud/commerce-vibes-builder' }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Detect version from releases/latest.json
        id: version
        run: |
          set -euo pipefail
          if [ ! -f releases/latest.json ]; then
            echo "::error::No releases/latest.json in merged commit"
            exit 1
          fi
          VERSION=$(jq -r '.version // empty' releases/latest.json)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::invalid version in latest.json: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected version: $VERSION"

      - name: Read release marker
        id: marker
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          MARKER="releases/${VERSION}.json"
          if [ ! -f "$MARKER" ]; then
            echo "::error::No marker $MARKER in merged commit"
            exit 1
          fi

          MONOREPO_REPO=$(jq -r '.monorepoRepo // empty' "$MARKER")
          MONOREPO_TAG=$(jq -r '.monorepoTag // empty' "$MARKER")
          VSIX_HASHES=$(jq -c '.vsixSha256Hashes // empty' "$MARKER")

          # Validate marker
          if ! echo "$VSIX_HASHES" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::malformed or missing vsixSha256Hashes in $MARKER"
            exit 1
          fi
          [ "$MONOREPO_REPO" = "$EXPECTED_MONOREPO" ] \
            || { echo "::error::monorepoRepo mismatch in $MARKER"; exit 1; }
          [ "$MONOREPO_TAG" = "v${VERSION}" ] \
            || { echo "::error::monorepoTag mismatch in $MARKER"; exit 1; }

          {
            echo "monorepo_repo=$MONOREPO_REPO"
            echo "monorepo_tag=$MONOREPO_TAG"
            echo "vsix_hashes<<EOF"
            echo "$VSIX_HASHES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download VSIX from public repo release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Download from THIS repo's release (created by monorepo via mirror-to-public-repo.yml)
          gh release download "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern '*.vsix' \
            --dir /tmp/vsix
          COUNT=$(ls /tmp/vsix/*.vsix 2>/dev/null | wc -l)
          [ "$COUNT" -ge 1 ] || { echo "::error::No .vsix on ${{ github.repository }}@v${VERSION}"; exit 1; }
          echo "VSIX_DIR=/tmp/vsix" >> "$GITHUB_ENV"

      - name: Verify VSIX SHA256 — third gate, fail closed
        env:
          VSIX_HASHES_JSON: ${{ steps.marker.outputs.vsix_hashes }}
        run: |
          set -euo pipefail
          # Verify SHA-256 for each platform VSIX
          FAILED=0
          for vsix in "$VSIX_DIR"/*.vsix; do
            BASENAME=$(basename "$vsix")
            # Extract platform from filename: salesforce-commerce-vibes-PLATFORM-VERSION.vsix
            PLATFORM=$(echo "$BASENAME" | sed -E 's/.*-((darwin|linux|win32)-(arm64|x64))-.*/\1/')
            EXPECTED_SHA=$(echo "$VSIX_HASHES_JSON" | jq -r --arg p "$PLATFORM" '.[$p] // empty')

            if [ -z "$EXPECTED_SHA" ]; then
              echo "::error::No expected SHA-256 for platform: $PLATFORM"
              FAILED=1
              continue
            fi

            ACTUAL_SHA=$(sha256sum "$vsix" | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::SHA-256 mismatch for $PLATFORM. expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
              FAILED=1
            else
              echo "::notice::SHA-256 verified for $PLATFORM: $ACTUAL_SHA"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      # Note: SLSA attestation verification is skipped here because:
      # 1. Public repo GITHUB_TOKEN cannot access private repo attestations (HTTP 404)
      # 2. Attestation was already verified in the private repo before mirroring
      # We verify SHA-256 against the committed release marker as our trust anchor.

      - name: Extract changelog section for release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Extract just this version's section from CHANGELOG.md
          awk -v ver="## ${VERSION}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          # Sanity check: notes should be non-empty
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::No changelog content for ${VERSION}; using placeholder"
            echo "Release v${VERSION}" > /tmp/release-notes.md
          fi

      - name: Trigger marketplace publishing workflows
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${VERSION}"

          # Verify release exists
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG does not exist"
            exit 1
          fi

          # Trigger VS Code Marketplace publishing
          gh workflow run publish-vscode.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f dry-run=false

          # Trigger OpenVSX publishing
          gh workflow run publish-openvsx.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f dry-run=false

          echo "::notice::Triggered marketplace publishing for $RELEASE_TAG"
